name: Build Admin Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'assets/**'
      - '.github/workflows/build-admin-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & prepare web assets
        run: |
          npm install
          npm install @capacitor/android@^6.1.2 --no-save
          npm run prepare:www

      - name: Add & Sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/CineVerse-Admin-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineVerse-Admin-Android-APK
          path: output/CineVerse-Admin-Android.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CineVerse Admin Latest Builds
          files: output/CineVerse-Admin-Android.apk
          make_latest: true
